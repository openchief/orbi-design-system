  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/theme.js"></script>
</head>
<body>
<header class="doc-top">
  <div class="responsive-wrapper">
    <a class="brand" href="../index.html"><span class="shell-logo-mark"></span> orbi design system</a>
    <div class="doc-top-actions"><a class="link" href="../index.html"><i class="ph-squares-four-bold"></i> All components</a><button class="icon-button" type="button" data-theme-toggle aria-label="Toggle theme"><i class="ph-moon-bold theme-icon-to-dark"></i><i class="ph-sun-bold theme-icon-to-light"></i></button></div>
  </div>
</header>
<main class="responsive-wrapper">
  <div class="doc-hero">
    <nav class="breadcrumb" aria-label="Breadcrumb"><ol>
      <li><a href="../index.html">Components</a></li>
      <li><a href="../index.html#feedback">Feedback</a></li>
      <li aria-current="page">Inline loading</li>
    </ol></nav>
    <h1>Inline loading</h1>
    <p>Shows the progress of a small, in-place action such as saving a field.</p>
  </div>
  <section class="doc-section">
    <h2>States</h2>
    <div class="doc-demo ">
<div class="stack">
  <span class="inline-loading"><span class="spinner spinner--sm"></span><span>Loading…</span></span>
  <span class="inline-loading is-success"><span class="spinner spinner--sm"></span><i class="ph-check-circle-bold status-icon ok"></i><span>Saved</span></span>
  <span class="inline-loading is-error"><span class="spinner spinner--sm"></span><i class="ph-warning-circle-bold status-icon err"></i><span>Failed to save</span></span>
</div>
    </div>
  </section>
  <section class="doc-section">
    <h2>Interactive</h2>
    <div class="doc-demo ">
<div class="row"><button class="button button--primary" type="button" data-inline-loading="#il1"><span>Save</span></button><button class="button" type="button" data-inline-loading="#il1" data-fail="true"><span>Save (fails)</span></button>
<span id="il1" class="inline-loading"><span class="spinner spinner--sm" hidden></span><i class="status-icon ok ph-check-circle-bold"></i><i class="status-icon err ph-warning-circle-bold"></i><span class="il-text">Idle</span></span></div>
    </div>
  </section>

  <footer class="doc-footer">
    <span><a class="link" href="empty-state.html"><i class="ph-arrow-left-bold"></i> Empty state</a></span><span><a class="link" href="loading.html">Loading <i class="ph-arrow-right-bold"></i></a></span>
  </footer>
</main>
<script src="https://unpkg.com/phosphor-icons"></script>
<script src="../js/code-samples.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
