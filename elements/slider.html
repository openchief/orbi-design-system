    <h1>Slider</h1>
    <p>Selects a value or quantity from a continuous range.</p>
  </div>
  <section class="doc-section">
    <h2>Default</h2>
    <div class="doc-demo ">
<div class="slider"><div class="slider-head"><label for="sl1">Volume</label><span class="slider-value"></span></div>
  <div class="slider-row"><span class="slider-bound">0</span><input id="sl1" type="range" min="0" max="100" value="40" data-unit="%"><span class="slider-bound">100</span></div></div>
    </div>
  </section>
  <section class="doc-section">
    <h2>Stepped & disabled</h2>
    <div class="doc-demo ">
<div class="stack-lg">
  <div class="slider"><div class="slider-head"><label for="sl2">Team size</label><span class="slider-value"></span></div>
  <div class="slider-row"><span class="slider-bound">5</span><input id="sl2" type="range" min="5" max="50" step="5" value="20"><span class="slider-bound">50</span></div></div>
  <div class="slider"><div class="slider-head"><label for="sl3">Disabled</label><span class="slider-value"></span></div>
  <div class="slider-row"><input id="sl3" type="range" min="0" max="10" value="3" disabled></div></div>
</div>
    </div>
  </section>
